name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Checkout COUI snapshot source
        uses: actions/checkout@v4
        with:
          repository: Costben/coui17
          path: coui

      - name: Publish COUI snapshot to local repo
        working-directory: coui
        run: gradle --no-daemon publishAllToLocalRepository -ProllingSnapshot

      # settings.gradle.kts 以 frontend/ 为基准找 ../../coui；Actions 的默认工作区是
      # $GITHUB_WORKSPACE/COBO_kit，checkout 的 coui 在其内部，因此在工作区上一级补一个入口。
      - name: Link COUI repository at expected path
        run: ln -s "$GITHUB_WORKSPACE/coui" "$GITHUB_WORKSPACE/../coui"

      - name: Build debug APK
        working-directory: frontend
        run: gradle --no-daemon :app:assembleDebug

      - name: Run unit tests
        working-directory: frontend
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cobo-debug-apk
          path: frontend/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 公开的 Release 资源，手机浏览器/下载器无需登录即可取，便于交付。
      - name: Publish APK to release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          files: frontend/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
